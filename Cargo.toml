[package]
name = "stacked"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "stacked"
path = "src/lib.rs"

[[bin]]
name = "stacked"
path = "src/main.rs"

[features]
# Every feature is on by default: `cargo build`, `cargo install --path .` and
# `cargo test` build all four. `--no-default-features` builds stacked with
# none of them, and `--features` then names those to keep:
# `--no-default-features --features demo,moz-phab` leaves out the browser
# and StackED.
default = ["web", "demo", "moz-phab", "app"]
# `stacked web`: the editor in a browser. Its browser half is built to wasm
# by build.rs, with Rust's wasm32-unknown-unknown target
# (`rustup target add wasm32-unknown-unknown`). Without that target, the
# build stops and says to add it, or to build without `web`.
web = ["dep:unicode-width"]
# `stacked app`: StackED, the editor in a window of its own, drawn as the
# terminal draws it, with eframe (egui) on OpenGL. On macOS, its File and
# Edit menus, panels and alerts are AppKit's, called through objc2. On
# Linux, building it needs no X11, Wayland or OpenGL package: eframe loads
# their libraries (and xkbcommon's) when StackED starts.
app = ["dep:eframe", "dep:ttf-parser", "dep:unicode-width", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
# `stacked demo`: a tour of the editor on a game of tic-tac-toe, its
# database and repository kept in memory: nothing is written on disk.
demo = []
# Phabricator, over Conduit with moz-phab's token (`curl` calls it): the
# reviews pulled (`stacked moz-phab pull`, the editor's `Pull reviews from
# Phabricator`), stacks imported from its revisions (`stacked moz-phab
# import`, the editor's `Import from Phabricator…`), and a patch submitted
# as work in progress (the editor's `Submit to Phabricator as WIP`).
moz-phab = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2.190"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1_smol = "1.0.1"
similar = "2"
toml = "0.9.8"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ttf-parser = { version = "0.25.1", optional = true }
unicode-width = { version = "0.2.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSAlert", "NSApplication", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }

[dev-dependencies]
tempfile = "3.27.0"
