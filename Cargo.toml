[package]
name = "stacked"
version = "0.1.0"
edition = "2024"

[lib]
name = "stacked"
path = "src/lib.rs"

[[bin]]
name = "stacked"
path = "src/main.rs"

[features]
# `stacked web`: the editor in a browser. Its browser half is built to wasm
# by build.rs, with Rust's wasm32-unknown-unknown target
# (`rustup target add wasm32-unknown-unknown`).
web = ["dep:unicode-width"]
# `stacked demo`: a tour of the editor on a game of tic-tac-toe, its
# database and repository kept in memory: nothing is written on disk.
demo = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1_smol = "1.0.1"
similar = "2"
toml = "0.9.8"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-width = { version = "0.2.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
