<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stacked</title>
<link rel="icon" type="image/png" sizes="32x32" data-path="/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" data-path="/icon-64.png">
<script>
// StackED's icon for the tab, each size at its path: asked for with the
// page's own query, its token, as all the page asks for is.
for (const icon of document.querySelectorAll('link[rel=icon]')) icon.href = icon.dataset.path + location.search;
</script>
<style>
:root { --fg: #cccccc; --bg: #1e1e1e; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
#screen { margin: 0; font: 14px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; user-select: none; cursor: default; }
#screen div { height: 1.3em; overflow: hidden; }
.cur { outline: 1px solid var(--fg); outline-offset: -1px; }
#gone, #editing { position: fixed; inset: 0; display: none; place-items: center; background: #000c; color: #fff; font: 16px sans-serif; }
/* Over the screen while $EDITOR runs, the mouse over it, not the screen:
   what is done meanwhile is dropped. */
#editing { text-align: center; white-space: pre-line; }
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="gone">stacked has quit: start it again, then reload.</div>
<div id="editing"></div>
<script>
// Only carries things: the server's lines to the wasm, what the wasm makes
// of them to the page, and to the system's banners, and what it makes of
// the page's keys and clicks to the server (web/client.rs says what each
// is).
const token = new URLSearchParams(location.search).get('t');
const screen = document.getElementById('screen'), gone = document.getElementById('gone'), editing = document.getElementById('editing');
const enc = new TextEncoder(), dec = new TextDecoder();
let w, cw = 8, ch = 16, pending = '', sending = false;
const read = n => dec.decode(new Uint8Array(w.memory.buffer, w.out(), n));
const call = (f, text, ...rest) => {
  const b = enc.encode(text), p = w.alloc(b.length);
  new Uint8Array(w.memory.buffer, p, b.length).set(b);
  return read(f(p, b.length, ...rest));
};
// One at a time, in order: what comes meanwhile goes together, next.
const flush = () => {
  if (sending || !pending) return;
  sending = true;
  const body = pending;
  pending = '';
  fetch('/input?t=' + token, {method: 'POST', body}).finally(() => { sending = false; flush(); });
};
// While $EDITOR runs, said over the screen, the server drops what the page
// does: it is not sent, but the page's size, for the screen after to fit.
const send = line => {
  if (!line || (editing.style.display === 'grid' && !line.startsWith('s '))) return;
  pending += line + '\n';
  flush();
};
// A notice of the editor's, a banner of the system's, only while the page
// is not what you look at: on it, the editor's own banner says it. Clicked,
// it brings the page forward, closes, and sends its line. Without the
// browser's permission, or without its notifications, nothing is shown.
const notice = (tag, title, body, line) => {
  if ((!document.hidden && document.hasFocus()) || !window.Notification || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {body, tag});
    n.onclick = () => { window.focus(); n.close(); send(line); };
  } catch (_) {}
};
// The browser's permission is asked once, on the first click or key that
// reaches the page, as a page may ask only then (Esc is no such key); once
// given or refused, never again.
const allow = e => {
  if (e.key === 'Escape') return;
  removeEventListener('mousedown', allow);
  removeEventListener('keydown', allow);
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (_) {}
};
addEventListener('mousedown', allow);
addEventListener('keydown', allow);
// A cell: a hundredth of a hundred characters' width, a row's height.
const size = () => {
  const row = document.createElement('div'), m = document.createElement('span');
  m.textContent = 'M'.repeat(100);
  row.append(m);
  screen.append(row);
  cw = m.getBoundingClientRect().width / 100;
  ch = row.getBoundingClientRect().height;
  row.remove();
  return [Math.floor(innerWidth / cw), Math.floor(innerHeight / ch)];
};
WebAssembly.instantiateStreaming(fetch('/client.wasm?t=' + token)).then(({instance}) => {
  w = instance.exports;
  const [cols, rows] = size();
  const events = new EventSource(`/events?t=${token}&cols=${cols}&rows=${rows}`);
  events.onmessage = e => {
    const out = call(w.screen, e.data), nl = out.indexOf('\n');
    const [op, a, b] = (nl < 0 ? out : out.slice(0, nl)).split(' ');
    // What is said over the screen while $EDITOR runs goes with the next
    // screen, which the server sends whole once $EDITOR exits.
    if (op === 'size') { editing.style.display = 'none'; screen.replaceChildren(...Array.from({length: +b}, () => document.createElement('div'))); }
    else if (op === 'row' && screen.children[+a]) screen.children[+a].innerHTML = out.slice(nl + 1);
    else if (op === 'bye') { events.close(); editing.style.display = 'none'; gone.style.display = 'grid'; }
    else if (op === 'notice') notice(...out.slice(nl + 1).split('\n'));
    else if (op === 'editing') { editing.textContent = out.slice(nl + 1); editing.style.display = 'grid'; }
  };
  addEventListener('keydown', e => {
    const line = call(w.key, e.key, e.ctrlKey, e.altKey, e.shiftKey, e.metaKey);
    if (line) { e.preventDefault(); send(line); }
  });
  screen.addEventListener('mousedown', e => {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    const r = screen.getBoundingClientRect();
    send(read(w.click(e.clientX - r.left, e.clientY - r.top, cw, ch, e.button === 2)));
  });
  // The left button down: a drag, for the editor to drag what the press
  // was held on; let go anywhere, said with its cell.
  screen.addEventListener('mousemove', e => {
    const r = screen.getBoundingClientRect();
    send(read((e.buttons & 1 ? w.dragged : w.moved)(e.clientX - r.left, e.clientY - r.top, cw, ch, document.hasFocus())));
  });
  addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    const r = screen.getBoundingClientRect();
    send(read(w.up(e.clientX - r.left, e.clientY - r.top, cw, ch)));
  });
  screen.addEventListener('mouseleave', () => send(read(w.left())));
  // The page losing the focus says the mouse gone, as mouseleave does;
  // the page getting the focus back says the mouse over the cell where the
  // mouse was last seen meanwhile.
  addEventListener('blur', () => send(read(w.blur())));
  addEventListener('focus', () => send(read(w.focus())));
  screen.addEventListener('contextmenu', e => e.preventDefault());
  // The wheel's mode is read before its turn, in that order: Firefox says
  // a mouse's notches in lines only to a page that reads the mode first,
  // and in pixels to any other, so that a notch would not always be a row
  // (web/client.rs `wheel`).
  addEventListener('wheel', e => {
    const mode = e.deltaMode;
    const dy = e.deltaY;
    const r = screen.getBoundingClientRect();
    send(read(w.wheel(e.clientX - r.left, e.clientY - r.top, cw, ch, dy, mode)));
  });
  addEventListener('paste', e => { e.preventDefault(); send(call(w.paste, e.clipboardData.getData('text'))); });
  addEventListener('resize', () => send('s ' + size().join(' ')));
});
</script>
</body>
</html>
