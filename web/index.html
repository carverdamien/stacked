<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stacked</title>
<link rel="icon" type="image/png" sizes="32x32" data-path="/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" data-path="/icon-64.png">
<script>
// StackED's icon for the tab, each size at its path: asked for with the
// page's own query, its token, as all the page asks for is.
for (const icon of document.querySelectorAll('link[rel=icon]')) icon.href = icon.dataset.path + location.search;
</script>
<style>
:root { --fg: #cccccc; --bg: #1e1e1e; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
#screen { margin: 0; font: 14px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; user-select: none; cursor: default; }
#screen div { height: 1.3em; overflow: hidden; }
.cur { outline: 1px solid var(--fg); outline-offset: -1px; }
/* Over the screen while $EDITOR runs, or once the server is lost, the
   mouse over it, not the screen: what is done meanwhile is dropped. */
#gone, #editing { position: fixed; inset: 0; display: none; place-items: center; background: #000c; color: #fff; font: 16px sans-serif; text-align: center; white-space: pre-line; }
</style>
</head>
<body>
<pre id="screen"></pre>
<div id="gone"></div>
<div id="editing"></div>
<script>
// Only carries things, and rings the bell: the server's lines to the wasm,
// what the wasm makes of them to the page, to the system's banners and to
// the bell, and what it makes of the page's keys and clicks to the server
// (web/client.rs says what each is).
const token = new URLSearchParams(location.search).get('t');
const screen = document.getElementById('screen'), gone = document.getElementById('gone'), editing = document.getElementById('editing');
const enc = new TextEncoder(), dec = new TextDecoder();
let w, cw = 8, ch = 16, pending = '', sending = false;
// The server's lines (an EventSource), which the browser asks for again by
// itself a second after it lost them, and each second after, at the same
// address with the same token, saying the launch they came from; whether
// they come now; what the first of them says, which stacked sends them
// (`v`): the build of the page and its wasm, the launch, which the tab
// keeps for the page loaded again, and whether that launch keeps its
// address for the next; and whether the editor quit since the last screen.
let events = null, connected = false, build = '', launch = '', kept = false, quit = false;
try { launch = sessionStorage.getItem('stacked-launch') || ''; } catch (_) {}
// Whether the screen is the editor's own, run in the page in a terminal of
// stacked web's (`t`), until the next screen's size: every key goes to it
// then, F1 to F12 and Insert too, but those with ⌘, and a paste as it is.
let terminal = false;
// What the page says over its screen without the server.
const said = {
  quit: 'stacked has quit.\nThis tab waits for stacked web to start again on this address, then goes on by itself.',
  lost: 'stacked cannot be reached.\nThis tab waits for stacked web to answer again on this address, then goes on by itself.',
  renewed: 'stacked web started again with a new address.\nThis tab can be closed.',
  over: 'stacked has quit.\nThe next stacked web opens a tab of its own, so this tab can be closed.',
};
const read = n => dec.decode(new Uint8Array(w.memory.buffer, w.out(), n));
const call = (f, text, ...rest) => {
  const b = enc.encode(text), p = w.alloc(b.length);
  new Uint8Array(w.memory.buffer, p, b.length).set(b);
  return read(f(p, b.length, ...rest));
};
// One at a time, in order: what comes meanwhile goes together, next.
const flush = () => {
  if (sending || !pending) return;
  sending = true;
  const body = pending;
  pending = '';
  fetch('/input?t=' + token, {method: 'POST', body}).finally(() => { sending = false; flush(); });
};
const shown = el => el.style.display === 'grid';
// While $EDITOR runs, said over the screen, the server drops what the page
// does: it is not sent, but the page's size, for the screen after to fit.
// Without the server, nothing is: the page says its size once the server
// answers again.
const send = line => {
  if (!line || shown(gone) || (shown(editing) && !line.startsWith('s '))) return;
  pending += line + '\n';
  flush();
};
// Said over the screen, which stays as it was, without the server: what
// was not sent yet is dropped, as what the page does meanwhile is.
const over = text => {
  editing.style.display = 'none';
  gone.textContent = text;
  gone.style.display = 'grid';
  pending = '';
};
// Whether the page is what you look at: shown, in the window that has the
// focus. Only while it is not are the notices shown and the bell rung: on
// it, the editor's own banner says what they tell.
const looked = () => !document.hidden && document.hasFocus();
// A notice of the editor's, a banner of the system's, only while the page
// is not what you look at. Clicked, it brings the page forward, closes, and
// sends its line. Without the browser's permission, or without its
// notifications, nothing is shown.
const notice = (tag, title, body, line) => {
  if (looked() || !window.Notification || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {body, tag});
    n.onclick = () => { window.focus(); n.close(); send(line); };
  } catch (_) {}
};
// The bell, which the server rings once for the notices it learned at
// once, whether the page shows them or not, only while the page is not what
// you look at: one soft strike of a small bell, made here with the Web
// Audio API, from no sound file. Its partials are a thin hemispherical
// shell's, as a desk bell's are: its pitch, A5, and 2.828 and 5.423 times
// it, each its peak, struck in STRUCK seconds, then dying away by 60 dB in
// its own time, the higher the sooner. A bell still sounding is not struck
// again.
const PITCH = 880, STRUCK = 0.004, PARTIALS = [[1, 0.15, 1.2], [2.828, 0.045, 0.6], [5.423, 0.015, 0.3]];
// The page's audio, made on the first click or key that reaches it, as a
// browser lets a page make sound only after one (Esc is no such key): until
// then, the bell is silent. Started there, as only a click or a key may
// start it, and on each one after until it has started once, as a browser
// may take a key for no such key (⌘ alone, as ⌘-Tab sends it, which `allow`
// passes over); then suspended while the bell does not sound. No Web Audio:
// never made.
let audio = null, started = false, strikes = 0, rung = -Infinity;
const ready = e => {
  if (e.key === 'Escape') return;
  const done = () => { removeEventListener('mousedown', ready); removeEventListener('keydown', ready); };
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    audio.resume().then(() => {
      if (started) return;
      started = true;
      done();
      if (!strikes) audio.suspend();
    }, () => {});
  } catch (_) { audio = null; done(); }
};
addEventListener('mousedown', ready);
addEventListener('keydown', ready);
const bell = () => {
  const asked = performance.now();
  if (looked() || !audio || asked - rung < 1000 * (STRUCK + PARTIALS[0][2])) return;
  rung = asked;
  const mine = ++strikes;
  const quiet = () => { if (strikes === mine) audio.suspend(); };
  try {
    audio.resume().then(() => {
      // Started late, as a browser may hold the audio back until the page
      // is shown again, or the page looked at since: not struck.
      if (looked() || performance.now() - asked > 1000) return quiet();
      const t = audio.currentTime + 0.01;
      for (const [ratio, peak, decay] of PARTIALS) {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = PITCH * ratio;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + STRUCK);
        g.gain.exponentialRampToValueAtTime(peak / 1000, t + STRUCK + decay);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t);
        o.stop(t + STRUCK + decay);
        // The pitch, the last to die away: then the audio suspended, unless
        // the bell was struck again since.
        if (ratio === 1) o.onended = quiet;
      }
    }, () => {});
  } catch (_) {}
};
// The browser's permission is asked once, on the first click or key that
// reaches the page, as a page may ask only then: Esc is no such key, nor is
// a modifier alone (`OS` is older Firefox's name for the system key), such
// as the ⌘ that each ⌘ shortcut (⌘-Tab, ⌘-L, ⌘-W, ⌘-1) sends first, on
// which a browser may drop the request without a prompt; once given or
// refused, never again.
const allow = e => {
  if (e.key === 'Escape' || ['Meta', 'Control', 'Alt', 'AltGraph', 'Shift', 'CapsLock', 'OS', 'Fn'].includes(e.key)) return;
  removeEventListener('mousedown', allow);
  removeEventListener('keydown', allow);
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (_) {}
};
addEventListener('mousedown', allow);
addEventListener('keydown', allow);
// A cell: a hundredth of a hundred characters' width, a row's height.
const size = () => {
  const row = document.createElement('div'), m = document.createElement('span');
  m.textContent = 'M'.repeat(100);
  row.append(m);
  screen.append(row);
  cw = m.getBoundingClientRect().width / 100;
  ch = row.getBoundingClientRect().height;
  row.remove();
  return [Math.floor(innerWidth / cw), Math.floor(innerHeight / ch)];
};
const heard = e => {
  const out = call(w.screen, e.data), nl = out.indexOf('\n');
  const [op, a, b, c] = (nl < 0 ? out : out.slice(0, nl)).split(' ');
  // What is said over the screen, while $EDITOR runs or without the
  // server, goes with the next screen, which the server sends whole once
  // $EDITOR exits, and to a page that comes.
  if (op === 'size') {
    quit = false;
    terminal = false;
    editing.style.display = 'none';
    gone.style.display = 'none';
    screen.replaceChildren(...Array.from({length: +b}, () => document.createElement('div')));
  }
  else if (op === 'row' && screen.children[+a]) screen.children[+a].innerHTML = out.slice(nl + 1);
  // The editor quit: the browser asks for the lines again each second, as
  // a launch that keeps its address listens on it again; one that keeps
  // none never does.
  else if (op === 'bye') {
    connected = false;
    quit = true;
    if (kept) over(said.quit);
    else { e.target.close(); events = null; over(said.over); }
  }
  else if (op === 'notice') notice(...out.slice(nl + 1).split('\n'));
  else if (op === 'bell') bell();
  else if (op === 'terminal') terminal = true;
  else if (op === 'editing') { gone.style.display = 'none'; editing.textContent = out.slice(nl + 1); editing.style.display = 'grid'; }
  // Which stacked sends the lines: one whose build is not the page's, newer
  // or older, has its own page loaded, which comes back as this one would;
  // else the page keeps which launch it is, and whether it keeps its
  // address.
  else if (op === 'version') {
    if (build && a !== build) return location.reload();
    build = a;
    launch = b;
    kept = c === '1';
    try { sessionStorage.setItem('stacked-launch', b); } catch (_) {}
  }
};
// The server's lines, asked for with the page's size, and with the launch
// the tab had them from last, if it knows one (as the browser says it too,
// asking again), for the server to tell a tab come back from another
// launch so. Come, the page says its size, which may differ from what the
// browser asks again with. Lost, said over the screen: refused, the token
// is not the server's, as stacked started again with a new one, and the
// browser asks no more; else it asks again each second by itself, but for
// a launch that kept no address, gone for good once it quit.
const connect = () => {
  const [cols, rows] = size();
  const es = events = new EventSource(`/events?t=${token}&cols=${cols}&rows=${rows}` + (launch ? `&l=${launch}` : ''));
  es.onopen = () => { connected = true; pending += `s ${size().join(' ')}\n`; flush(); };
  es.onmessage = heard;
  es.onerror = () => {
    connected = false;
    if (es.readyState === EventSource.CLOSED) { events = null; over(said.renewed); }
    else if (quit && !kept) { es.close(); events = null; over(said.over); }
    else over(quit ? said.quit : said.lost);
  };
};
// Closed, loaded again, or left for another page: the server told that
// the page goes, a line of its own, for stacked web to quit once its last
// page is gone and none came back (src/web.rs `all_gone`); its lines
// closed first, for the server to see them closed at once. Shown again as
// it was, from the browser's history, the page asks for them again.
addEventListener('pagehide', () => {
  if (events) { events.close(); events = null; }
  if (connected) navigator.sendBeacon('/input?t=' + token, 'g\n');
  connected = false;
});
addEventListener('pageshow', e => { if (e.persisted && w && !events) connect(); });
WebAssembly.instantiateStreaming(fetch('/client.wasm?t=' + token)).then(({instance}) => {
  w = instance.exports;
  connect();
  addEventListener('keydown', e => {
    const line = call(w.key, e.key, e.ctrlKey, e.altKey, e.shiftKey, e.metaKey, terminal);
    if (line) { e.preventDefault(); send(line); }
  });
  screen.addEventListener('mousedown', e => {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    const r = screen.getBoundingClientRect();
    send(read(w.click(e.clientX - r.left, e.clientY - r.top, cw, ch, e.button === 2)));
  });
  // The left button down: a drag, for the editor to drag what the press
  // was held on; let go anywhere, said with its cell.
  screen.addEventListener('mousemove', e => {
    const r = screen.getBoundingClientRect();
    send(read((e.buttons & 1 ? w.dragged : w.moved)(e.clientX - r.left, e.clientY - r.top, cw, ch, document.hasFocus())));
  });
  addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    const r = screen.getBoundingClientRect();
    send(read(w.up(e.clientX - r.left, e.clientY - r.top, cw, ch)));
  });
  screen.addEventListener('mouseleave', () => send(read(w.left())));
  // The page losing the focus says the mouse gone, as mouseleave does;
  // the page getting the focus back says the mouse over the cell where the
  // mouse was last seen meanwhile.
  addEventListener('blur', () => send(read(w.blur())));
  addEventListener('focus', () => send(read(w.focus())));
  screen.addEventListener('contextmenu', e => e.preventDefault());
  // The wheel's mode is read before its turn, in that order: Firefox says
  // a mouse's notches in lines only to a page that reads the mode first,
  // and in pixels to any other, so that a notch would not always be a row
  // (web/client.rs `wheel`).
  addEventListener('wheel', e => {
    const mode = e.deltaMode;
    const dy = e.deltaY;
    const r = screen.getBoundingClientRect();
    send(read(w.wheel(e.clientX - r.left, e.clientY - r.top, cw, ch, dy, mode)));
  });
  // A paste: the keys that type it, but while the screen is the editor's,
  // its text as it is, for the server to bracket it if the editor asks.
  addEventListener('paste', e => { e.preventDefault(); send(call(terminal ? w.pasted : w.paste, e.clipboardData.getData('text'))); });
  addEventListener('resize', () => send('s ' + size().join(' ')));
});
</script>
</body>
</html>
